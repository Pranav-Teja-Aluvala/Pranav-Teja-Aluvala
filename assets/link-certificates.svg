<svg xmlns="http://www.w3.org/2000/svg" width="276" height="102" viewBox="-6 -4 276 102" role="img" aria-labelledby="title desc"><title id="title">Certificates</title><desc id="desc">Certificates</desc><defs><clipPath id="panel"><rect x="1" y="1" width="250" height="64" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="13" width="250" height="64" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="250" height="64" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="250" height="64" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><rect x="13" y="14" width="38" height="36" rx="6" fill="#eceef0" stroke="none"/><g transform="translate(19 19)"><rect x="1" y="1" width="24" height="23" rx="3" fill="none" stroke="#344b65" stroke-width="1.5"/><path d="M6 8H20M6 13H16M16 20L20 29L23 23L29 23L23 17" fill="none" stroke="#344b65" stroke-width="1.5"/></g><text x="63" y="38" font-size="18" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >Certificates</text><path d="M224 25L236 13M224 13H236V25" fill="none" str