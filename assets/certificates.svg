<svg xmlns="http://www.w3.org/2000/svg" width="960" height="140" viewBox="0 0 960 140" role="img" aria-labelledby="title"><title id="title">Still a work in progress. Certificates, hackathons and learning.</title><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141d29"/><stop offset="1" stop-color="#090e16"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#75dbc8" stop-opacity=".17"/><stop offset="1" stop-color="#75dbc8" stop-opacity="0"/></radialGradient>
<linearGradient id="ink"><stop stop-color="#f6f8fb"/><stop offset="1" stop-color="#a7b9cc"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#66d8c1"/><stop offset=".48" stop-color="#76adf3"/><stop offset="1" stop-color="#c0b6ee"/></linearGradient>
<linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#d4eeff" stop-opacity=".12"/><stop offset="1" stop-color="#d4eeff" stop-opacity=".02"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a3c2dc" stroke-opacity=".04"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="frame"><rect x="1" y="1" width="958" height="138" rx="20"/></clipPath>
</defs><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes travel{to{stroke-dashoffset:-80}}
@keyframes equalize{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.orbit{animation:orbit 38s linear infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 8s ease-in-out infinite}
.pulse{animation:breathe 5s ease-in-out infinite}
.signal{stroke-dasharray:3 17;animation:travel 4s linear infinite}
.eq{animation:equalize 2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.signal,.eq{animation:none}}
</style><g clip-path="url(#frame)"><rect x="0" y="0" width="960" height="140" rx="20" fill="url(#bg)" stroke="none" /><rect x="0" y="0" width="960" height="140" rx="0" fill="url(#grid)" stroke="none" /><circle cx="830" cy="87" r="210" fill="url(#halo)" /><text x="30" y="32" font-size="12" fill="#8adbc9" font-family="Consolas, Courier New, monospace" letter-spacing="1.1">THE LEARNING NEVER REALLY STOPS</text><text x="29" y="80" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#edf3f9" letter-spacing="-.7">Still a work in progress.</text><text x="31" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#9caec0" >Machine learning · Hackathons · Assessments · Simulations</text><g transform="translate(742 20)"><ellipse cx="78" cy="51" rx="89" ry="29" fill="none" stroke="#4c7d7b" transform="rotate(-27 78 51)"/><ellipse cx="78" cy="51" rx="63" ry="46" fill="none" stroke="#7f9cc6" transform="rotate(29 78 51)"/><g class="orbit"><circle cx="78" cy="4" r="4" fill="#a4dbd7" /><circle cx="78" cy="98" r="3" fill="#90b3e6" /></g><circle cx="78" cy="51" r="19" fill="url(#glass)" stroke="#90bdbd"/><text x="67" y="58" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c7e8e2" >∞</text></g></g><rect x="1" y="1" width="958" height="138" rx="20" fill="none" stroke="#2b3746" /><line x1="34" y1="1" x2="310" y2="1" stroke="#7897ac" stroke-opacity=".55"/></svg>