<svg xmlns="http://www.w3.org/2000/svg" width="504" height="554.3" viewBox="-6 -4 504 554.3" role="img" aria-labelledby="title desc"><title id="title">Support Ticket Intelligence. A local support inbox that classifies English banking questions into 77 intents. A reviewer accepts or corrects each recommendation. The model suggests; the human decides. 90.20% held-out test accuracy  Python · scikit-learn · TF-IDF · Logistic regression. Result recorded on a processed BANKING77 split. Single-user local demo; private repository.</title><desc id="desc">Support Ticket Intelligence. A local support inbox that classifies English banking questions into 77 intents. A reviewer accepts or corrects each recommendation. The model suggests; the human decides. 90.20% held-out test accuracy  Python · scikit-learn · TF-IDF · Logistic regression. Result recorded on a processed BANKING77 split. Single-user local demo; private repository.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="478" height="516.3" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}.spin{animation:spin 36s linear infinite;transform-box:fill-box;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.spin,.drift,.dash,.eq{animation:none}}</style><rect x="10" y="13" width="478" height="516.3" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="478" height="516.3" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="478" height="516.3" rx="12" fill="#faf9f6" stroke="none"/>