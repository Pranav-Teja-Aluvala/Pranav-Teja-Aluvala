<svg xmlns="http://www.w3.org/2000/svg" width="984" height="529.4499999999999" viewBox="-6 -4 984 529.4499999999999" role="img" aria-labelledby="title desc"><title id="title">DROP. Share files, links, and notes in a temporary two-device room. The host approves pairing; both devices compare a verification code before sending. WebRTC carries the transfer, and the receiver checks the file before saving.   React · TypeScript · Node.js · WebRTC. Direct-only public beta. Some networks require a relay. Real-device and cross-network certification, independent security review, and capacity testing remain pending. Avoid sensitive files during the beta.</title><desc id="desc">DROP. Share files, links, and notes in a temporary two-device room. The host approves pairing; both devices compare a verification code before sending. WebRTC carries the transfer, and the receiver checks the file before saving.   React · TypeScript · Node.js · WebRTC. Direct-only public beta. Some networks require a relay. Real-device and cross-network certification, independent security review, and capacity testing remain pending. Avoid sensitive files during the beta.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="958" height="491.44999999999993" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="13" width="958" height="491.44999999999993" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="958" height="491.44999999999993" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="958" height="491.44999999999993" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><rect x="1" y="1" width="958" height="57" rx="0" fill="#eceef0" stroke="none"/><text x="30" y="36" font-size="15" fill="#25364c" font-family="Consolas, Courier New, monospace" >01 / DEVICE-TO-DEVICE SHARING</text><path d="M1 58L959 58" fill="none" stroke="#25364c" /><text x="30" y="112" font-size="49" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">DROP</text><text x="30" y="158.15" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >Share files, links, and notes in a temporary</text><text x="30" y="190.81" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >two-device room. The host approves pairing; both</text><text x="30" y="223.47" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >devices compare a verification code before</text><text x="30" y="256.13" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >sending. WebRTC carries the transfer, and the</text><text x="30" y="288.78999999999996" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >receiver checks the file before saving.</text><rect x="30" y="306.84" width="78" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="44" y="329.84" font-size="16" fill="#344b65" font-family="Consolas, Courier New, monospace" >React</text><rect x="118" y="306.84" width="128" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="132" y