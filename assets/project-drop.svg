<svg xmlns="http://www.w3.org/2000/svg" width="960" height="218" viewBox="0 0 960 218" role="img" aria-labelledby="title"><title id="title">DROP</title><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141d29"/><stop offset="1" stop-color="#090e16"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7adcca" stop-opacity=".17"/><stop offset="1" stop-color="#7adcca" stop-opacity="0"/></radialGradient>
<linearGradient id="ink"><stop stop-color="#f6f8fb"/><stop offset="1" stop-color="#a7b9cc"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#66d8c1"/><stop offset=".48" stop-color="#76adf3"/><stop offset="1" stop-color="#c0b6ee"/></linearGradient>
<linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#d4eeff" stop-opacity=".12"/><stop offset="1" stop-color="#d4eeff" stop-opacity=".02"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a3c2dc" stroke-opacity=".04"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="frame"><rect x="1" y="1" width="958" height="216" rx="20"/></clipPath>
</defs><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes travel{to{stroke-dashoffset:-80}}
@keyframes equalize{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.orbit{animation:orbit 38s linear infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 8s ease-in-out infinite}
.pulse{animation:breathe 5s ease-in-out infinite}
.signal{stroke-dasharray:3 17;animation:travel 4s linear infinite}
.eq{animation:equalize 2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.signal,.eq{animation:none}}
</style><g clip-path="url(#frame)"><rect x="0" y="0" width="960" height="218" rx="20" fill="url(#bg)" stroke="none" /><rect x="0" y="0" width="960" height="218" rx="0" fill="url(#grid)" stroke="none" /><circle cx="805" cy="113" r="230" fill="url(#halo)" /><text x="30" y="34" font-size="12" fill="#7adcca" font-family="Consolas, Courier New, monospace" letter-spacing="1.1">01 / DEVICE-TO-DEVICE</text><text x="29" y="91" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#edf3f9" font-weight="700" letter-spacing="-1">DROP</text><text x="31" y="129" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a9b9c9" >A small bridge between your devices.</text><line x1="31" y1="160" x2="531" y2="160" stroke="#26313f" /><text x="31" y="191" font-size="12" fill="#7adcca" font-family="Consolas, Courier New, monospace" letter-spacing="1.1">PAIR → TRANSFER → DISAPPEAR</text><g class="float"><g transform="translate(631 41) skewY(-10)"><rect x="0" y="0" width="108" height="122" rx="12" fill="url(#glass)" stroke="#517480" /><rect x="15" y="17" width="78" height="75" rx="6" fill="#152837" stroke="#315161" /><line x1="36" y1="106" x2="73" y2="106" stroke="#91c9cc" /><rect x="34" y="36" width="42" height="40" rx="5" fill="#1e414b" stroke="#70bfb4" /><line x1="45" y1="49" x2="65" y2="49" stroke="#98d8cb" /><line x1="45" y1="59" x2="60" y2="59" stroke="#98d8cb" /></g><g transform="translate(815 60) skewY(-10)"><rect x="0" y="0" width="108" height="122" rx="12" fill="url(#glass)" stroke="#517480" /><rect x="15" y="17" width="78" height="75" rx="6" fill="#152837" stroke="#315161" /><line x1="36" y1="106" x2="73" y2="106" stroke="#91c9cc" /><text x="38" y="66" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#91e4cc" >✓</text></g></g><path d="M743 106C769 85 785 126 811 105" fill="none" stroke="#3c6d70" stroke-width="2"/><path d="M743 106C769 85 785 126 811 105" fill="none" stroke="#b4ffeb" stroke-width="3" class="signal"/></g><rect x="1" y="1" width="958" height="216" rx="20" fill="none" stroke="#2b3746" /><line x1="34" y1="1" x2="310" y2="1" stroke="#7897ac" stroke-opacity=".55"/></svg>