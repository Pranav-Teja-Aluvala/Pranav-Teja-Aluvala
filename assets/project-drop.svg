<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440.73999999999995" viewBox="0 0 960 440.73999999999995" role="img" aria-labelledby="title desc"><title id="title">DROP. Files, links, and notes between two devices in a temporary room. No recipient signup: pair the devices and share through a direct WebRTC connection when the network cooperates.   React · TypeScript · Node.js · WebRTC. Direct-only public beta. Some networks require a relay. Real-device and cross-network certification, independent security review, and capacity testing remain pending. Avoid sensitive files during the beta.</title><desc id="desc">DROP. Files, links, and notes between two devices in a temporary room. No recipient signup: pair the devices and share through a direct WebRTC connection when the network cooperates.   React · TypeScript · Node.js · WebRTC. Direct-only public beta. Some networks require a relay. Real-device and cross-network certification, independent security review, and capacity testing remain pending. Avoid sensitive files during the beta.</desc><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}.spin{animation:spin 36s linear infinite;transform-box:fill-box;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.spin,.drift,.dash,.eq{animation:none}}</style><rect x="1" y="1" width="958" height="438.73999999999995" rx="8" fill="#fff8e9" stroke="#392c50"/><rect x="1" y="1" width="958" height="57" rx="0" fill="#e4ee9b" stroke="none"/><text x="30" y="36" font-size="15" fill="#392c50" font-family="Consolas, Courier New, monospace" >01 / DEVICE-TO-DEVICE SHARING</text><path d="M1 58L959 58" fill="none" stroke="#392c50" /><text x="30" y=