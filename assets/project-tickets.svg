<svg xmlns="http://www.w3.org/2000/svg" width="984" height="559.05" viewBox="-6 -4 984 559.05" role="img" aria-labelledby="title desc"><title id="title">Support Ticket Intelligence. A local support inbox that classifies English banking questions into 77 intents. A reviewer accepts or corrects each recommendation. The model suggests; the human decides. 90.20% held-out test accuracy  Python · scikit-learn · TF-IDF · Logistic regression. Result recorded on a processed BANKING77 split. Single-user local demo; private repository.</title><desc id="desc">Support Ticket Intelligence. A local support inbox that classifies English banking questions into 77 intents. A reviewer accepts or corrects each recommendation. The model suggests; the human decides. 90.20% held-out test accuracy  Python · scikit-learn · TF-IDF · Logistic regression. Result recorded on a processed BANKING77 split. Single-user local demo; private repository.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="958" height="521.05" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="1