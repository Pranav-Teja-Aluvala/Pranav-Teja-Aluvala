t x="286" y="363.42" width="88" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="300" y="386.42" font-size="16" fill="#344b65" font-family="Consolas, Courier New, monospace" >TF-IDF</text><rect x="384" y="363.42" width="217" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="398" y="386.42" font-size="16" fill="#344b65" font-family="Consolas, Courier New, monospace" >Logistic regression</text><rect x="706" y="83" width="218" height="222" rx="10" fill="#eceef0" stroke="#c4cbd3"/><g transform="translate(731 113)"><style>@keyframes ticketScan{0%,12%{transform:translateY(0);opacity:0}20%{opacity:.65}58%{transform:translateY(58px);opacity:.65}66%,100%{transform:translateY(58px);opacity:0}}@keyframes ticketConfirm{0%,58%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}@keyframes ticketHalo{0%,60%,100%{opacity:0}76%{opacity:.6}}.ticket-scan{animation:ticketScan 5.6s ease-in-out infinite}.ticket-check{stroke-dasharray:1;stroke-dashoffset:0;animation:ticketConfirm 5.6s ease-in-out infinite}.ticket-halo{animation:ticketHalo 5.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.ticket-scan,.ticket-halo{display:none}.ticket-check{animation:none;stroke-dashoffset:0}}</style><g transform="rotate(-10 75 70)"><rect x="0" y="0" width="145" height="117" rx="0" fill="#eceef0" stroke="#25364c"/><rect x="14" y="18" width="94" height="7" rx="0" fill="#344b65" stroke="none"/><rect x="14" y="37" width="72" height="7" rx="0" fill="#344b65" stroke="none"/><rect x="14" y="56" width="94" height="7" rx="0" fill="#344b65" stroke="none"/><rect class="ticket-scan" x="10" y="12" width="125" height="5" rx="2" fill="#687584" stroke="none"/></g><circle cx="126" cy="104" r="38" fill="#344b65" /><circle cx="126" cy="104" r="44" fill="none" stroke="#344b65" stroke-width="1.5" class="ticket-halo"/><path d="M106 104L120 117L148 87" pathLength="1" stroke="#faf9f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" class="ticket-check"/></g><path d="M30 430.42L930 430.42" fill="none" stroke="#c4cbd3" /><text x="30" y="461.42" font-size="19" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >Result recorded on a processed BANKING77 split. Single-user local demo; private</text><text x="30" y="488.40000000000003" font-size="19" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >repository.</text><rect x="1" y="1" width="958" height="521.05" rx="0" fill="url(#linen)" stroke="none"/></g><rect x="1" y="1" width="958" height="521.05" rx="12" fill="none" stroke="#c4cbd3"/></svg>