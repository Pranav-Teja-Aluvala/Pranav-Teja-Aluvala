<svg xmlns="http://www.w3.org/2000/svg" width="960" height="503" viewBox="0 0 960 503" role="img" aria-labelledby="title desc"><title id="title">Support Ticket Intelligence. A local support inbox that classifies English banking questions into 77 intents. A reviewer accepts or corrects each recommendation. The model suggests; the human decides. 90.20% held-out test accuracy  Python · scikit-learn · TF-IDF · Logistic regression. Result recorded on a processed BANKING77 split. Single-user local demo; private repository.</title><desc id="desc">Support Ticket Intelligence. A local support inbox that classifies English banking questions into 77 intents. A reviewer accepts or corrects each recommendation. The model suggests; the human decides. 90.20% held-out test accuracy  Python · scikit-learn · TF-IDF · Logistic regression. Result recorded on a processed BANKING77 split. Single-user local demo; private repository.</desc><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}.spin{animation:spin 36s linear infinite;transform-box:fill-box;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.spin,.drift,.dash,.eq{animation:none}}</style><rect x="1" y="1" width="958" height="501" rx="8" fill="#fff8e9" stroke="#392c50"/><rect x="1" y="1" width="958" height="57" rx="0" fill="#dfcff0" stroke="none"/><text x="30" y="36" font-size="15" fill="#392c50" font-family="Consolas, Courier New, monospace" >02 / MACHINE LEARNING, HUMAN JUDGEMENT</text><path d="M1 58L959 58" fill="none" stroke="#392c50" /><text x="30" y="112" font-size="49" fill="#392c50" font-family="Georgia, Times New Roman, serif" font-style="italic">Support Ticket</text><text x="30" y="1