<rect x="1" y="20" width="5" height="165" rx="2" fill="#9c4938"/>
<text x="39" y="35" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="2.2" fill="#9c4938">02 / SELECTED WORK</text>
<text x="1150" y="35" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="1.2" fill="#9c4938">PRIVATE REPO</text>
<text x="39" y="82" font-family="Georgia,serif" font-size="36" fill="#242621">Support Ticket Intelligence</text>
