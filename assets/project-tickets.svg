<text x="40" y="160" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4f514c">A local support inbox that classifies English banking questions into 77 intents.</text>
<text x="40" y="194" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4f514c">Human review stays in the loop: inspect, approve, or correct each suggestion.</text>
