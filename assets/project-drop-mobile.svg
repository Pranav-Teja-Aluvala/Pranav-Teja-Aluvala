<svg xmlns="http://www.w3.org/2000/svg" width="504" height="528.31" viewBox="-6 -4 504 528.31" role="img" aria-labelledby="title desc"><title id="title">DROP. Files, links, and notes between two devices in a temporary room. No recipient signup: pair the devices and share through a direct WebRTC connection when the network cooperates.   React · TypeScript · Node.js · WebRTC. Direct-only public beta. Some networks require a relay. Real-device and cross-network certification, independent security review, and capacity testing remain pending. Avoid sensitive files during the beta.</title><desc id="desc">DROP. Files, links, and notes between two devices in a temporary room. No recipient signup: pair the devices and share through a direct WebRTC connection when the network cooperates.   React · TypeScript · Node.js · WebRTC. Direct-only public beta. Some networks require a relay. Real-device and cross-network certification, independent security review, and capacity testing remain pending. Avoid sensitive files during the beta.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="478" height="490.30999999999995" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}.spin{animation:spin 36s linear infinite;transform-box:fill-box;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.spin,.drift,.dash,.eq{animation:none}}</style><rect x="10" y="13" width="478" height="490.30999999999995" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="478" heig