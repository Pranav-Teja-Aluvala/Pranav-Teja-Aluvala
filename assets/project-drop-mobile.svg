<svg xmlns="http://www.w3.org/2000/svg" width="504" height="577.46" viewBox="-6 -4 504 577.46" role="img" aria-labelledby="title desc"><title id="title">DROP. Share files, links, and notes in a temporary two-device room. The host approves pairing; both devices compare a verification code before sending. WebRTC carries the transfer, and the receiver checks the file before saving.   React · TypeScript · Node.js · WebRTC. Direct-only public beta. Some networks require a relay. Real-device and cross-network certification, independent security review, and capacity testing remain pending. Avoid sensitive files during the beta.</title><desc id="desc">DROP. Share files, links, and notes in a temporary two-device room. The host approves pairing; both devices compare a verification code before sending. WebRTC carries the transfer, and the receiver checks the file before saving.   React · TypeScript · Node.js · WebRTC. Direct-only public beta. Some networks require a relay. Real-device and cross-network certification, independent security review, and capacity testing remain pending. Avoid sensitive files during the beta.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="478" height="539.46" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="13" width="478" height="539.46" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="478" height="539.46" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="478" height="539.46" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><rect x="1" y="1" width="478" height="57" rx="0" fill="#eceef0" stroke="none"/><text x="30" y="36" font-size="13" fill="#25364c" font-family="Consolas, Courier New, monospace" >01 / DEVICE-TO-DEVICE SHARING</text><path d="M1 58L479 58" fill="none" stroke="#25364c" /><text x="30" y="112" font-size="37" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">DROP</text><text x="30" y="153.95" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >Share files, links, and notes in a</text><text x="30" y="182.35" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >temporary two-device room. The host</text><text x="30" y="210.75" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >approves pairing; both devices compare</text><text x="30" y="239.14999999999998" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >a verification code before sending.</text><text x="30" y="267.54999999999995" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >WebRTC carries the transfer, and the</text><text x="30" y="295.95" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >receiver checks the file before saving.</text><rect x="30" y="312.95" width="72" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="44" y="335.95" font-size="14" fill="#344b65" font-family="Consolas, Courier New, monospace" >React</text><rect x="112" y="312.95" width="115" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="126" y="335.95" font-size="14" fill="#344b65" font-family="Consolas, Courier New, monospace" >TypeScript</text><rect x="237" y="312.95" width="89" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="251" y="335.95" font-size="14" fill="#344b65" font-family="Consolas, Courier New, monospace" >Node.js</text><rect x="336" y="312.95" width="81" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="350" y="335.95" font-size="14" fill="#344b65" font-family="Consolas, Courier New, monospace" >WebRTC</text><path d="M30 379.95L450 379.95" fill="none" stroke="#c4cbd3" /><text x="30" y="410.95" font-size="17" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >Direct-only public beta. Some networks require</text><text x="30" y="435.09" font-size="17" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >a relay. Real-device and cross-network</text><text x="30" y="459.23" font-size="17" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >certification, independent security review,</text><text x="30" y="483.37" font-size="17" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >and capacity testing remain pending. Avoid</text><text x="30" y="507.51" font-size="17" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >sensitive files during the beta.</text><rect x="1" y="1" width="478" height="539.46" rx="0" fill="url(#linen)" stroke="none"/></g><rect x="1" y="1" width="478" height="539.46" rx="12" fill="none" stroke="#c4cbd3"/></svg>