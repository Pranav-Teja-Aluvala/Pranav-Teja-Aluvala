<svg xmlns="http://www.w3.org/2000/svg" width="984" height="559.05" viewBox="-6 -4 984 559.05" role="img" aria-labelledby="title desc"><title id="title">ChromaQuant. Learn a color palette with K-means, compare it with uniform RGB, and download an indexed PNG. On the 16-color demo, K-means achieved 35.85 dB PSNR.</title><desc id="desc">ChromaQuant. Learn a color palette with K-means, compare it with uniform RGB, and download an indexed PNG. On the 16-color demo, K-means achieved 35.85 dB PSNR.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="958" height="521.05" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="13" width="958" height="521.05" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="958" height="521.05" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="958" height="521.05" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><rect x="1" y="1" width="958" height="57" rx="0" fill="#e7e9ec" stroke="none"/><text x="30" y="36" font-size="15" fill="#25364c" font-family="Consolas, Courier New, monospace" >02 / IMAGE COMPRESSION</text><path d="M1 58L959 58" fill="none" stroke="#25364c" /><text x="30" y="112" font-size="49" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">ChromaQuant</text><text x="30" y="168.84" font-size="49" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">Palette studio</text><text x="30" y="214.99" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >Learn a palette from the colors in your image.</text><text x="30" y="247.65" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >Compare K-means with a uniform RGB palette,</text><text x="30" y="280.31" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >inspect the difference in a split preview,</text><text x="30" y="312.97" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >and download the result as an indexed PNG.</text><text x="30" y="348.02000000000004" font-size="24" fill="#344b65" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">35.85 dB at 16 colors</text><rect x="30" y="363.42" width="88" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="44" y="386.42" font-size="16" fill="#344b65" font-family="Consolas, Courier New, monospace" >Canvas</text><rect x="128" y="363.42" width="148" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="142" y="386.42" font-size="16" fill="#344b65" font-family="Consolas, Courier New, monospace" >Web Workers</text><rect x="286" y="363.42" width="88" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="300" y="386.42" font-size="16" fill="#344b65" font-family="Consolas, Courier New, monospace" >RGB</text><rect x="384" y="363.42" width="217" height="34" rx="7" fill="#eceef0" stroke="#c4cbd3"/><text x="398" y="386.42" font-size="16" fill="#344b65" font-family="Consolas, Courier New, monospace" >K-means++</text><rect x="706" y="83" width="218" height="222" rx="10" fill="#eceef0" stroke="#c4cbd3"/><g transform="translate(731 113)"><rect x="0" y="0" width="34" height="34" rx="3" fill="#588d99"/><rect x="36" y="0" width="34" height="34" rx="3" fill="#749ca1"/><rect x="72" y="0" width="34" height="34" rx="3" fill="#9ea9a0"/><rect x="108" y="0" width="34" height="34" rx="3" fill="#cdbba6"/><rect x="0" y="36" width="34" height="34" rx="3" fill="#ead0a2"/><rect x="36" y="36" width="34" height="34" rx="3" fill="#ffc989"/><rect x="72" y="36" width="34" height="34" rx="3" fill="#c7a788"/><rect x="108" y="36" width="34" height="34" rx="3" fill="#aa9e87"/><rect x="0" y="72" width="34" height="34" rx="3" fill="#83938a"/><rect x="36" y="72" width="34" height="34" rx="3" fill="#697e75"/><rect x="72" y="72" width="34" height="34" rx="3" fill="#516d69"/><rect x="108" y="72" width="34" height="34" rx="3" fill="#39595b"/><rect x="0" y="108" width="34" height="34" rx="3" fill="#799e96"/><rect x="36" y="108" width="34" height="34" rx="3" fill="#59878a"/><rect x="72" y="108" width="34" height="34" rx="3" fill="#376b74"/><rect x="108" y="108" width="34" height="34" rx="3" fill="#1b4249"/></g><path d="M30 430.42L930 430.42" fill="none" stroke="#c4cbd3" /><text x="30" y="461.42" font-size="19" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >Measured on the Afterglow demo. Uniform RGB scored 17.41 dB</text><text x="30" y="488.40000000000003" font-size="19" fill="#687584" font-family="Trebuchet MS, Arial, sans-serif" >at the same 16-color budget.</text><rect x="1" y="1" width="958" height="521.05" rx="0" fill="url(#linen)" stroke="none"/></g><rect x="1" y="1" width="958" height="521.05" rx="12" fill="none" stroke="#c4cbd3"/></svg>