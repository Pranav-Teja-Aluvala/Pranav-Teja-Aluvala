<svg xmlns="http://www.w3.org/2000/svg" width="276" height="102" viewBox="-6 -4 276 102" role="img" aria-labelledby="title desc"><title id="title">Try the beta</title><desc id="desc">Try the beta</desc><defs><clipPath id="panel"><rect x="1" y="1" width="250" height="64" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}.spin{animation:spin 36s linear infinite;transform-box:fill-box;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.spin,.drift,.dash,.eq{animation:none}}</style><rect x="10" y="13" width="250" height="64" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="250" height="64" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="250" height="64" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><rect x="13" y="14" width="38" height="36" rx="6" fill="#eceef0" stroke="none"/><g transform="translate(19 19)"><circle cx="13" cy="13" r="12" fill="none" stroke="#344b65" stroke-width="1.5"/><path d="M10 7L20 13L10 19Z" fill="#344b65"/></g><text x="63" y="38" font-size="18" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >Try the beta</text><path d="M224 25L236 13M224 13H236V25" fill="none" stroke="#687584" stroke-width="1.3"/><rect x="1" y="1" width="250" height="64" rx="0" fill="url(#linen)" stroke="none"/></g><rect x="1" y="1" width="250" height="64" rx="12" fill="none" stroke="#c4cbd3"/></svg>