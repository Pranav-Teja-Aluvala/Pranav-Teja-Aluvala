<svg xmlns="http://www.w3.org/2000/svg" width="504" height="411" viewBox="-6 -4 504 411" role="img" aria-labelledby="title desc"><title id="title">Teaching machines to learn. Still learning myself. Open to internships.</title><desc id="desc">Teaching machines to learn. Still learning myself. Open to internships.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="478" height="373" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="13" width="478" height="373" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="478" height="373" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="478" height="373" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><text x="30" y="40" font-size="14" fill="#344b65" font-family="Consolas, Courier New, monospace" >CURIOSITY, COMPILED.</text><text x="27" y="111" font-size="49" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">Teaching machines</text><text x="28" y="166" font-size="49" fill="#344b65" font-family="Georgia, Times New Roman, serif" font-style="italic">to learn.</text><text x="30" y="224" font-size="30" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">Still learning myself.</text><path d="M30 318L450 318" fill="none" stroke="#25364c" /><circle cx="36" cy="347" r="4" fill="#344b65" /><text x="49" y="353" font-size="16" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >Open to internships</text><rect x="1" y="1" width="478" height="373" rx="0" fill="url(#linen)" stroke="none"/></g><rect x="1" y="1" width="478" height="373" rx="12" fill="none" stroke="#c4cbd3"/></svg>