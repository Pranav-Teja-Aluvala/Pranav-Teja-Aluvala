.orbit{animation:orbit 38s linear infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 8s ease-in-out infinite}
.pulse{animation:breathe 5s ease-in-out infinite}
.signal{stroke-dasharray:3 17;animation:travel 4s linear infinite}
.eq{animation:equalize 2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
