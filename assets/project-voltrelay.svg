<svg xmlns="http://www.w3.org/2000/svg" width="984" height="593.1999999999999" viewBox="-6 -4 984 593.1999999999999" role="img" aria-labelledby="title desc"><title id="title">VoltRelay Energy. A notebook exploring a battery-swapping network: station outages, battery health, and support-ticket patterns. A chunked cleaning workflow processes swap events and saves cleaned data as Parquet. 3,877,013 swap-event rows in saved output The dataset had opinions about RAM. Python · pandas · Matplotlib. Exploratory analysis. Source datasets are not included in the repository; completion-event labels need alignment before affected revenue and retention outputs can support conclusions.</title><desc id="desc">VoltRelay Energy. A notebook exploring a battery-swapping network: station outages, battery health, and support-ticket patterns. A chunked cleaning workflow processes swap events and saves cleaned data as Parquet. 3,877,013 swap-event rows in saved output The dataset had opinions about RAM. Python · pandas · Matplotlib. Exploratory analysis. Source datasets are not included in the repository; completion-event labels need alignment before affected revenue and retention outputs can support conclusions.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="958" height="555.1999999999999" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="13" width="958" height="555.1999999999999" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="958" height="555.1999999999999" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="958" height="555.1999999999999" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><rect x="1" y="1" width="958" height="57" rx="0" fill="#d9dfe5" stroke="none"/><text x="30" y="36" font-size="15" fill="#25364c" font-family="Consolas, Courier New, monospace" >03 / HACKATHON DATA ANALYSIS</text><path d="M1 58L959 58" fill="none" stroke="#25364c" /><text x="30" y="112" font-size="49" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">VoltRelay Energy</text><text x="30" y="158.15" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >A notebook exploring a battery-swapping network:</text><text x="30" y="190.81" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >station outages, battery health, and</text><text x="30" y="223.47" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >support-ticket patterns. A chunked cleaning</text><text x="30" y="256.13" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >workflow processes swap events and saves cleaned</text><text x="30" y="288.78999999999996" font-size="23" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >data as Parquet.</text><text x="30" y="323.84" font-size="24" fill="#344b65" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">3,877,013 swap-event rows in saved output</text><text x="30" y="356.23999999999995" font-size="21" fill="#687584" font-family="Georgia, Times New R