<svg xmlns="http://www.w3.org/2000/svg" width="504" height="363.91999999999996" viewBox="-6 -4 504 363.91999999999996" role="img" aria-labelledby="title desc"><title id="title">Open to internships. AI/ML, software development, and practical engineering. Real projects, thoughtful teams, and building beyond localhost.</title><desc id="desc">Open to internships. AI/ML, software development, and practical engineering. Real projects, thoughtful teams, and building beyond localhost.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="478" height="325.91999999999996" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}.spin{animation:spin 36s linear infinite;transform-box:fill-box;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.spin,.drift,.dash,.eq{animation:none}}</style><rect x="10" y="13" width="478" height="325.91999999999996" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="478" height="325.91999999999996" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="478" height="325.91999999999996" rx="12" fill="#eceef0" stroke="none"/><g clip-path="url(#panel)"><rect x="1" y="1" width="478" height="54" rx="0" fill="#d9dfe5" stroke="none"/><text x="30" y="35" font-size="14" fill="#25364c" font-family="Consolas, Courier New, monospace" >OPEN TO INTERNSHIPS</text><path d="M1 55L479 55" fill="none" stroke="#25364c" /><text x="30" y="112" font-size="36" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="ita