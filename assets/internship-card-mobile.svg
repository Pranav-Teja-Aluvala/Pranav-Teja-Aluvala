<svg xmlns="http://www.w3.org/2000/svg" width="504" height="482.58000000000004" viewBox="-6 -4 504 482.58000000000004" role="img" aria-labelledby="title desc"><title id="title">Open to internships. I’m looking for internship opportunities in AI/ML, software development, and practical engineering. I’d love to contribute to real projects, learn from a team, and build things beyond localhost. I take the work seriously. The README gets the occasional joke.</title><desc id="desc">Open to internships. I’m looking for internship opportunities in AI/ML, software development, and practical engineering. I’d love to contribute to real projects, learn from a team, and build things beyond localhost. I take the work seriously. The README gets the occasional joke.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="478" height="444.58000000000004" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="13" width="478" height="444.58000000000004" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="478" height="444.58000000000004" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="478" height="444.58000000000004" rx="12" fill="#eceef0" stroke="none"/><g clip-path="url(#panel)"><rect x="1" y="1" width="478" height="54" rx="0" fill="#d9dfe5" stroke="none"/><text text-anchor="middle" x="240" y="35" font-size="14" fill="#25364c" font-family="Consolas, Courier New, monospace" >OPEN TO INTERNSHIPS</text><path d="M1 55L479 55" fill="none" stroke="#25364c" /><text text-anchor="middle" x="240" y="112" font-size="36" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">Let’s make something</text><text text-anchor="middle" x="240" y="163.12" font-size="36" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">good.</text><text text-anchor="middle" x="240" y="204.72" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >I’m looking for internship</text><text text-anchor="middle" x="240" y="233.12" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >opportunities in AI/ML, software</text><text text-anchor="middle" x="240" y="261.52" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >development, and practical engineering.</text><text text-anchor="middle" x="240" y="289.91999999999996" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >I’d love to contribute to real</text><text text-anchor="middle" x="240" y="318.32" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >projects, learn from a team, and build</text><text text-anchor="middle" x="240" y="346.72" font-size="20" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >things beyond localhost.</text><text text-anchor="middle" x="240" y="383.72" font-size="18" fill="#687584" font-family="Georgia, Times New Roman, serif" font-style="italic">I take the work seriously. The README gets</text><text text-anchor="middle" x="240" y="409.28000000000003" font-size="18" fill="#687584" font-family="Georgia, Times New Roman, serif" font-style="italic">the occasional joke.</text><rect x="1" y="1" width="478" height="444.58000000000004" rx="0" fill="url(#linen)" stroke="none"/></g><rect x="1" y="1" width="478" height="444.58000000000004" rx="12" fill="none" stroke="#c4cbd3"/></svg>