<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 486" width="1272" height="486" role="img" aria-labelledby="t d">
  <title id="t">Teaching machines to learn. Still learning myself.</title>
  <desc id="d">Third-year CSE student in Warangal, India. Open to internships.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <!-- soft, wide ambient shadow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blurWide"/>
      <feOffset in="blurWide" dy="22" result="offWide"/>
      <feColorMatrix in="offWide" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0.18 0" result="shadowWide"/>
      <!-- tight contact shadow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blurTight"/>
      <feOffset in="blurTight" dy="5" result="offTight"/>
      <feColorMatrix in="offTight" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0.16 0" result="shadowTight"/>
      <feMerge>
        <feMergeNode in="shadowWide"/>
        <feMergeNode in="shadowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(36 14)">
    <rect x="1" y="1" width="1198" height="398" rx="10" fill="#f5f3ee" stroke="#e6e2d8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="80" y="72" width="64" height="4" fill="#a8392b"/>
    <text x="80" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#1f1f1d" letter-spacing="-1.5">Teaching machines to learn.</text>
    <text x="80" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#1f1f1d" letter-spacing="-1.5">Still learning myself.</text>
    <text x="80" y="296" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#5d5d58">Computer science &amp; machine learning</text>
    <line x1="80" y1="332" x2="1120" y2="332" stroke="#dcd8cc" stroke-width="1.5"/>
    <text x="80" y="366" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5d5d58">Third-year CSE student · Warangal, India</text>
    <text x="1120" y="366" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#a8392b">Open to internships ↗</text>
  </g>
</svg>
