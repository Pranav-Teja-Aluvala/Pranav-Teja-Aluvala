<svg xmlns="http://www.w3.org/2000/svg" width="984" height="406" viewBox="-6 -4 984 406" role="img" aria-labelledby="title desc"><title id="title">Teaching machines to learn. Still learning myself. Open to internships.</title><desc id="desc">Teaching machines to learn. Still learning myself. Open to internships.</desc><defs><clipPath id="panel"><rect x="1" y="1" width="958" height="368" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}@keyframes transfer{0%,10%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(36px);opacity:1}85%,100%{transform:translateX(36px);opacity:0}}@keyframes received{0%,65%,100%{opacity:.15}75%,90%{opacity:1}}.packet{animation:transfer 4.8s ease-in-out infinite}.received{animation:received 4.8s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.packet,.received,.drift,.dash,.eq{animation:none}.packet{opacity:1}}</style><rect x="10" y="13" width="958" height="368" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="958" height="368" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="958" height="368" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><text x="30" y="40" font-size="14" fill="#344b65" font-family="Consolas, Courier New, monospace" >CURIOSITY, COMPILED.</text><text x="27" y="126" font-size="66" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">Teaching machines</text><text x="28" y="199" font-size="66" fill="#344b65" font-family="Georgia, Times New Roman, serif" font-style="italic">to learn.</text><text x="30" y="259" font-size="40" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">Still learning myself.</text><rect x="712" y="75" width="177" height="178" rx="4" fill="#eceef0" stroke="#c4cbd3"/><rect x="700" y="63" width="177" height="178" rx="4" fill="#faf9f6" stroke="#c4cbd3"/><path d="M721 88L856 88" fill="none" stroke="#c4cbd3" /><text x="722" y="126" font-size="20" fill="#687584" font-family="Georgia, Times New Roman, serif" font-style="italic">perpetually</text><text x="722" y="164" font-size="24" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">in progress.</text><path d="M721 194L856 194" fill="none" stroke="#c4cbd3" /><text x="723" y="220" font-size="12" fill="#687584" font-family="Consolas, Courier New, monospace" >ONE COMMIT AT A TIME</text><path d="M30 313L930 313" fill="none" stroke="#25364c" /><circle cx="36" cy="342" r="4" fill="#344b65" /><text x="49" y="348" font-size="16" fill="#25364c" font-family="Trebuchet MS, Arial, sans-serif" >Open to internships</text><text x="530" y="348" font-size="16" fill="#687584" font-family="Georgia, Times New Roman, serif" font-style="italic">Models. Messy data. Mildly unreasonable ideas.</text><rect x="1" y="1" width="958" height="368" rx="0" fill="url(#linen)" stroke="none"/></g><rect x="1" y="1" width="958" height="368" rx="12" fill="none" stroke="#c4cbd3"/></svg>