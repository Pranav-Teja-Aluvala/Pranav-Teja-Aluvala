<svg xmlns="http://www.w3.org/2000/svg" width="504" height="112" viewBox="-6 -4 504 112" role="img" aria-labelledby="title desc"><title id="title">The workbench</title><desc id="desc">The workbench</desc><defs><clipPath id="panel"><rect x="1" y="1" width="478" height="74" rx="12"/></clipPath><pattern id="linen" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 2H12M2 0V12" stroke="#9ba7b5" stroke-width=".4" opacity=".12"/></pattern></defs><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}.spin{animation:spin 36s linear infinite;transform-box:fill-box;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.spin,.drift,.dash,.eq{animation:none}}</style><rect x="10" y="13" width="478" height="74" rx="12" fill="#d9dde2" stroke="none"/><rect x="5" y="7" width="478" height="74" rx="12" fill="#e8ebef" stroke="none"/><rect x="1" y="1" width="478" height="74" rx="12" fill="#faf9f6" stroke="none"/><g clip-path="url(#panel)"><rect x="13" y="13" width="50" height="50" rx="7" fill="#344b65" stroke="none"/><text x="22" y="46" font-size="22" fill="#faf9f6" font-family="Consolas, Courier New, monospace" >01</text><text x="87" y="48" font-size="24" fill="#25364c" font-family="Georgia, Times New Roman, serif" font-style="italic">The workbench</text><path d="M381 28L446 28" fill="none" stroke="#c4cbd3" /><path d="M381 39L446 39" fill="none" stroke="#c4cbd3" /><path d="M381 50L446 50" fill="none" stroke="#c4cbd3" /><rect x="1" y="1" width="478" height="74" rx="0" fill="url(#linen)" stroke="none"/></g><rect x="1" y="1" width="478" height="74" rx="12" fill="none" stroke="#c4cbd3"/></svg>