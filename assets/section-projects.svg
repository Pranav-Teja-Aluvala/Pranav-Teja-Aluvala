<svg xmlns="http://www.w3.org/2000/svg" width="960" height="68" viewBox="0 0 960 68" role="img" aria-labelledby="title desc"><title id="title">Things I’ve built</title><desc id="desc">Things I’ve built</desc><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes eq{50%{transform:scaleY(.35)}}.spin{animation:spin 36s linear infinite;transform-box:fill-box;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:4 11;animation:dash 4s linear infinite}.eq{animation:eq 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@media(prefers-reduced-motion:reduce){.spin,.drift,.dash,.eq{animation:none}}</style><rect x="1" y="1" width="958" height="66" rx="8" fill="#fff8e9" stroke="#392c50"/><rect x="1" y="1" width="64" height="66" rx="0" fill="#344bd5" stroke="none"/><text x="17" y="44" font-size="24" fill="#fff8e9" font-family="Consolas, Courier New, monospace" >02</text><text x="87" y="44" font-size="28" fill="#392c50" font-family="Georgia, Times New Roman, serif" font-style="italic">Things I’ve built</text><path d="M861 22L926 22" fill="none" stroke="#392c50" /><path d="M861 33L926 33" fill="none" stroke="#392c50" /><path d="M861 44L926 44" fill="none" stroke="#392c50" /></svg>